include: package:lints/recommended.yaml

analyzer:
  # POCs and vendored references are independent projects with their own
  # analyzers. Walking them from the framework root makes `dart analyze`
  # traverse millions of reference lines and can leave the CI gate timing out.
  exclude:
    - poc/**
    - referencias/**
    - build/**
    # Probes that name `dart:isolate` members added in 3.13. The package
    # declares `^3.6.0` on purpose, so these do not compile here and are run
    # only against an SDK that has the API. See the library comment in
    # `tool/sdk313/created_isolate_drain_probe.dart`.
    - tool/sdk313/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print: false
    - directives_ordering
    - prefer_single_quotes
