# Spike de investigacao: existe rota 100% Dart para a main thread do macOS?
#
# NAO e um gate. Cada probe explora uma hipotese que pode legitimamente abortar
# o processo ou travar - por isso todo passo captura o exit code em vez de
# falhar o job, e cada um tem seu proprio timeout. O resultado sao os logs.
#
# Disparo manual apenas: `gh workflow run "macOS main-thread spike"`.
name: macOS main-thread spike

on:
  workflow_dispatch:

concurrency:
  group: mainthread-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: '3.6.0'

jobs:
  spike:
    name: 'Spike: main thread ownership (macos-14 arm64)'
    runs-on: macos-14
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/poc_03_appkit_window
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Build probe (JIT, aot-snapshot, exe)
        run: |
          mkdir -p build
          # Keep DWARF in the exe so lldb can symbolicate AppKit/CF frames.
          # (--save-debugging-info strips it OUT of the binary.)
          dart compile aot-snapshot bin/probe.dart -o build/probe.aot
          dart compile exe bin/probe.dart -o build/probe
          chmod +x build/probe
          echo "----- debug tools on this runner -----"
          which lldb && lldb --version | head -2
          which sample && which atos && which dsymutil
          file build/probe
          # Confirm the binary still carries some debug/unwind info.
          dwarfdump --uuid build/probe 2>/dev/null || true
          size build/probe 2>/dev/null || ls -la build/probe

      - name: 'Backend 3: minimal Objective-C AppKit host owns thread 0'
        timeout-minutes: 2
        run: |
          mkdir -p /tmp/shots
          clang -fobjc-arc -Wall -Wextra -framework Cocoa \
            -framework QuartzCore -framework IOSurface \
            ../../poc/poc_20_macos_three_backends/native/minimal_appkit_host.m \
            -o build/minimal_appkit_host
          ./build/minimal_appkit_host --smoke-seconds 1 \
            | tee /tmp/shots/minimal-appkit-host.log
          grep -q '^MAIN_THREAD=1$' /tmp/shots/minimal-appkit-host.log
          grep -Eq '^WINDOW_ID=[1-9][0-9]*$' \
            /tmp/shots/minimal-appkit-host.log
          dart run \
            ../../poc/poc_20_macos_three_backends/bin/native_host_protocol_smoke.dart \
            build/minimal_appkit_host \
            | tee /tmp/shots/minimal-appkit-ipc.log
          grep -q '^DART_IPC_SMOKE=PASS$' \
            /tmp/shots/minimal-appkit-ipc.log

      - name: 'Three-backend selection policy'
        run: |
          dart analyze ../../poc/poc_20_macos_three_backends
          dart test ../../poc/poc_20_macos_three_backends

      # The same six lines gate every backend. PIXEL_WITNESS is the only one no
      # backend can fake: screencapture(1) photographs the CGSWindowID from
      # another process, so the frame has to exist in the WindowServer.
      - name: 'Backend 1 conformance: window, present, pixels, input, teardown'
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/shots
          dart compile exe \
            ../../poc/poc_20_macos_three_backends/bin/conformance.dart \
            -o build/conformance
          # Bounded in-step: the extra drain outside the port callback is the
          # call earlier probes saw block in mach_msg, so a stall has to name
          # itself instead of being killed by the step timeout.
          status=0
          OBJC_DEBUG_MISSING_POOLS=YES CONFORMANCE_SHOTS=/tmp/shots \
            ./build/conformance skylight > /tmp/conformance-skylight.log 2>&1 &
          pid=$!
          for i in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "backend 1 conformance still running after 90s; sampling"
            mkdir -p /tmp/lldb
            sample "$pid" 2 1 -file /tmp/lldb/conformance-skylight.sample || true
            kill -9 "$pid" 2>/dev/null || true
            status=124
          fi
          wait "$pid" 2>/dev/null || rc=$?
          [ "$status" -eq 124 ] || status=${rc:-0}
          cat /tmp/conformance-skylight.log
          echo "exit=$status"
          if [ -f /tmp/lldb/conformance-skylight.sample ]; then
            head -60 /tmp/lldb/conformance-skylight.sample || true
          fi
          grep -Eq '^WINDOW_ID=[1-9][0-9]*$' /tmp/conformance-skylight.log
          grep -q '^PRESENT=PASS$' /tmp/conformance-skylight.log
          grep -q '^PIXEL_WITNESS=PASS' /tmp/conformance-skylight.log
          grep -Eq '^INPUT_EVENTS=([3-9]|[1-9][0-9]+)$' \
            /tmp/conformance-skylight.log
          grep -q '^POINTER_INPUT=1$' /tmp/conformance-skylight.log
          grep -q '^TEARDOWN=PASS$' /tmp/conformance-skylight.log
          grep -q '^CONFORMANCE=PASS$' /tmp/conformance-skylight.log
          if grep -q 'MISSING POOLS' /tmp/conformance-skylight.log; then
            echo 'autorelease-pool regression'
            exit 1
          fi
          # Returning normally from main() is part of the contract.
          [ "$status" -eq 0 ]

      - name: 'Backend 3 conformance: window, present, pixels, input, teardown'
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/shots
          status=0
          CONFORMANCE_SHOTS=/tmp/shots ./build/conformance \
            appkit-native-host build/minimal_appkit_host \
            > /tmp/conformance-native-host.log 2>&1 || status=$?
          cat /tmp/conformance-native-host.log
          echo "exit=$status"
          grep -Eq '^WINDOW_ID=[1-9][0-9]*$' /tmp/conformance-native-host.log
          grep -q '^PRESENT=PASS$' /tmp/conformance-native-host.log
          grep -q '^PIXEL_WITNESS=PASS' /tmp/conformance-native-host.log
          grep -Eq '^INPUT_EVENTS=[1-9][0-9]*$' \
            /tmp/conformance-native-host.log
          grep -q '^TEARDOWN=PASS$' /tmp/conformance-native-host.log
          grep -q '^CONFORMANCE=PASS$' /tmp/conformance-native-host.log
          [ "$status" -eq 0 ]

      # The two candidates for backend 3's future. Both get measured; neither
      # gets assumed.
      #
      # An in-process embedder wins on cost by construction - there is no
      # boundary - but only if the stock SDK ships a linkable VM. That is a
      # question with a yes/no answer, and the linker gives it.
      - name: 'Embedder option: does the stock SDK ship a linkable VM?'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          SDK="$DART_HOME"
          echo "----- what the SDK actually ships -----"
          ls "$SDK" && ls "$SDK/include"
          echo "----- anything linkable? -----"
          find "$SDK" \( -name 'libdart*' -o -name '*.a' -o -name '*.dylib' \) \
            -maxdepth 3 2>/dev/null | head -20 || echo '(none)'
          echo "----- do the Dart_* symbols exist in the shipped binaries? -----"
          for binary in "$SDK/bin/dart" "$SDK/bin/dartaotruntime"; do
            [ -f "$binary" ] || continue
            echo "== $binary"
            nm -gU "$binary" 2>/dev/null | grep -c '_Dart_' \
              || echo 'no exported Dart_ symbols'
          done
          echo "----- try to link a native main() against Dart_Initialize -----"
          set +e
          clang -I"$SDK/include" \
            ../../poc/poc_20_macos_three_backends/native/embedder_feasibility.c \
            -o build/embedder_feasibility 2> /tmp/embedder-link.txt
          link_status=$?
          set -e
          echo "link exit=$link_status"
          cat /tmp/embedder-link.txt || true
          if [ "$link_status" -eq 0 ]; then
            echo 'EMBEDDER_FEASIBLE=1'
          else
            echo 'EMBEDDER_FEASIBLE=0'
          fi

      # And the worker-process option: what does the boundary actually cost,
      # measured three ways against the same host and the same window?
      - name: 'Worker option: pipe vs shared memory vs IOSurface'
        timeout-minutes: 6
        run: |
          dart compile exe \
            ../../poc/poc_20_macos_three_backends/bin/transport_benchmark.dart \
            -o build/transport_benchmark
          status=0
          # Three resolutions, because the transports are expected to diverge
          # with frame size: the pipe copies every byte twice, shared memory
          # copies none but still rebuilds a CGImage over all of them, and an
          # IOSurface should barely notice. A 480x320 result alone cannot tell
          # those apart.
          ./build/transport_benchmark build/minimal_appkit_host 120 \
            480x320,1920x1080,3840x2160 \
            > /tmp/transport-benchmark.log 2>&1 || status=$?
          cat /tmp/transport-benchmark.log
          echo "exit=$status"
          for size in 480x320 1920x1080 3840x2160; do
            grep -q "^TRANSPORT=pipe size=$size " /tmp/transport-benchmark.log
            grep -q "^TRANSPORT=shm size=$size " /tmp/transport-benchmark.log
            grep -q "^TRANSPORT=iosurface size=$size " \
              /tmp/transport-benchmark.log
            # The supported acquisition must not cost more per frame than the
            # deprecated one, or the debt was not actually paid.
            grep -q "^TRANSPORT=iosurface-port size=$size " \
              /tmp/transport-benchmark.log
            # iosurface-port is in the running now and can win outright, so the
            # gate is "a zero-copy transport won", not a fixed name.
            grep -Eq \
              "^TRANSPORT_WINNER=(shm|iosurface|iosurface-port) size=$size$" \
              /tmp/transport-benchmark.log
          done
          [ "$status" -eq 0 ]
          {
            echo '## Frame transport across the process boundary'
            echo
            echo '| size | transport | min us | median us | fps | pipe bytes/frame |'
            echo '|---|---|---|---|---|---|'
            grep '^TRANSPORT=' /tmp/transport-benchmark.log | while read -r l; do
              name=$(echo "$l" | sed -E 's/^TRANSPORT=([^ ]+).*/\1/')
              size=$(echo "$l" | sed -E 's/.* size=([0-9x]+).*/\1/')
              min=$(echo "$l" | sed -E 's/.*min_us=([0-9]+).*/\1/')
              med=$(echo "$l" | sed -E 's/.*median_us=([0-9]+).*/\1/')
              fps=$(echo "$l" | sed -E 's/.*fps=([0-9.]+).*/\1/')
              bytes=$(echo "$l" | sed -E 's/.*pipe_bytes_per_frame=([0-9]+).*/\1/')
              echo "| $size | $name | $min | $med | $fps | $bytes |"
            done
            echo
            grep -E '^(TRANSPORT_WINNER|TRANSPORT_SPEEDUP|IPC_BASELINE_US|EMBEDDER_HEADROOM_US)=' \
              /tmp/transport-benchmark.log | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      # The transport benchmark measured what a present COSTS. This measures
      # whether the compositor keeps up, which a per-frame number cannot show:
      # with one shared surface, Dart writes into the same pages the
      # WindowServer is scanning out, so a frame can be composited
      # half-updated. Sizing that window is what decides whether double
      # buffering is needed, rather than assuming it is.
      #
      # Not a gate. It fails only if the host stops answering, because then the
      # numbers describe nothing.
      - name: 'Present pacing: does the compositor keep up, and how wide is the tear window?'
        timeout-minutes: 4
        run: |
          status=0
          dart run \
            ../../poc/poc_20_macos_three_backends/bin/vsync_probe.dart \
            build/minimal_appkit_host 120 > /tmp/vsync.log 2>&1 || status=$?
          cat /tmp/vsync.log
          echo "exit=$status"
          [ "$status" -eq 0 ]
          {
            echo '## Present pacing at 1920x1080'
            echo
            grep -E '^VSYNC_' /tmp/vsync.log | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      # ADR 0001 chose a worker process partly BECAUSE it isolates crashes, and
      # then listed crash detection and restart as a requirement rather than a
      # detail. This is that requirement: SIGKILL the host mid-session and
      # check that Dart notices, that the surface outlives the process that was
      # drawing from it, and that a fresh host attaches the SAME surface. That
      # last one is what makes recovery cheap - the window is new, the
      # framebuffer is not.
      - name: 'Host crash: does the surface outlive the host, and can it restart?'
        timeout-minutes: 3
        run: |
          status=0
          dart run \
            ../../poc/poc_20_macos_three_backends/bin/host_recovery_probe.dart \
            build/minimal_appkit_host > /tmp/host-recovery.log 2>&1 || status=$?
          cat /tmp/host-recovery.log
          echo "exit=$status"
          grep -q '^SURFACE_SURVIVED_CRASH=1$' /tmp/host-recovery.log
          grep -q '^HOST_EXIT_STATUS=-9$' /tmp/host-recovery.log
          grep -q '^HOST_RECOVERY=PASS$' /tmp/host-recovery.log
          [ "$status" -eq 0 ]

      # IOSurfaceLookup is deprecated. The supported replacement passes a mach
      # port, and a port right does not fit through a pipe - that is the whole
      # difficulty, not a detail. Three ways of moving it are implemented and
      # this asks the machine which of them still works:
      #
      #   registered   mach_ports_register, inherited across the fork. Reported
      #                clobbered by libxpc's atfork handler in 2014; unverified
      #                on 14/15, and Dart's Process.start does fork.
      #   bootstrap    bootstrap_register, deprecated since 10.5.
      #   rendezvous   the host checks in under a pid-derived name and the
      #                parent sends the port to it. Chromium ships this shape,
      #                with the roles swapped.
      #
      # A mechanism the OS refuses is the FINDING, not a broken build. The step
      # fails only if the deprecated path it is meant to replace regresses.
      - name: 'Surface handoff: which mach-port mechanism still works?'
        timeout-minutes: 4
        run: |
          status=0
          dart run \
            ../../poc/poc_20_macos_three_backends/tool/surface_port_probe.dart \
            build/minimal_appkit_host > /tmp/surface-port-probe.log 2>&1 \
            || status=$?
          cat /tmp/surface-port-probe.log
          echo "exit=$status"
          grep -q '^SURFACE_FALLBACK_PRESENT=PRESENT_OK 2 surface$' \
            /tmp/surface-port-probe.log
          [ "$status" -eq 0 ]
          {
            echo '## Mach-port surface handoff'
            echo
            grep -E '^(SURFACE_PORT_WINNERS|SURFACE_PORT_PRESENT|PROBE_)' \
              /tmp/surface-port-probe.log | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      # The frame benchmark measured the boundary going out. This measures it
      # coming in, split across the same event with the system-wide clock:
      # inject -> host is WindowServer and AppKit, which an embedder would still
      # pay, and host -> Dart is the only part it would remove.
      - name: 'Worker option: input latency, split across the boundary'
        timeout-minutes: 4
        run: |
          dart compile exe \
            ../../poc/poc_20_macos_three_backends/bin/input_latency_benchmark.dart \
            -o build/input_latency_benchmark
          status=0
          ./build/input_latency_benchmark build/minimal_appkit_host 60 \
            > /tmp/input-latency.log 2>&1 || status=$?
          cat /tmp/input-latency.log
          echo "exit=$status"
          grep -q '^INPUT_LATENCY_INJECT_TO_HOST ' /tmp/input-latency.log
          grep -q '^INPUT_LATENCY_HOST_TO_DART ' /tmp/input-latency.log
          grep -q '^INPUT_LATENCY_END_TO_END ' /tmp/input-latency.log
          grep -Eq '^INPUT_EVENTS_DELIVERED=[1-9][0-9]*' /tmp/input-latency.log
          [ "$status" -eq 0 ]
          {
            echo '## Input latency across the process boundary'
            echo
            grep -E '^(INPUT_LATENCY_|INPUT_BOUNDARY_SHARE|INPUT_END_TO_END_FRAME_SHARE|INPUT_SUB_MILLISECOND|INPUT_EVENTS_)' \
              /tmp/input-latency.log | sed 's/^/- `/;s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 'Probe A: does any execution mode own the main thread?'
        timeout-minutes: 5
        run: |
          echo "----- JIT: dart run -----"
          dart run bin/probe.dart thread || echo "exit=$?"
          echo "----- dartaotruntime snapshot -----"
          dartaotruntime build/probe.aot thread || echo "exit=$?"
          echo "----- AOT exe -----"
          ./build/probe thread || echo "exit=$?"

      # Probe B ([NSApp run] from the Dart thread) is settled: it blocks forever
      # without transferring main-thread ownership. The subcommand is still
      # there, but running it costs a full 2-minute timeout for an answer
      # already recorded in doc/SPIKE_MACOS_MAIN_THREAD.md.

      - name: 'Probe C: WindowServer via SkyLight/CGS, no AppKit'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe skylight || echo "exit=$?"

      - name: 'Probe D: hijack the main thread with a signal'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe signal-hijack || echo "exit=$?"

      - name: 'Backend 2 lifecycle: stop hijacked run loop without _exit'
        timeout-minutes: 2
        run: |
          ./build/probe graceful-hijack-shutdown \
            2>&1 | tee /tmp/graceful-hijack-shutdown.log
          grep -q '^NORMAL_SHUTDOWN=PASS$' \
            /tmp/graceful-hijack-shutdown.log

      # The wedge in F/K/L is postEvent:atStart:, not the pump: hold-appkit
      # fired its repeating distantPast pump ~1000 times in 20s with no block,
      # while everything scheduled after a postEvent never ran. This probe
      # therefore never posts: sendEvent: is fed retained synthetic NSEvents
      # (dispatch half) and SLEventPostToPid feeds the real queue (pump half).
      # Only liveness and normal shutdown gate for now; the dispatch/pump
      # counts are reported and promoted to gates once measured green.
      - name: 'Backend 2 input: dispatch, pump liveness, normal shutdown'
        timeout-minutes: 2
        run: |
          ./build/probe dispatch-loop \
            2>&1 | tee /tmp/dispatch-loop.log
          grep -q '^PUMP_LIVENESS=PASS' /tmp/dispatch-loop.log
          grep -q '^NORMAL_SHUTDOWN=PASS$' /tmp/dispatch-loop.log

      # Bounded in-step instead of relying on the step timeout: a step that
      # times out is killed before it can print anything, and the whole point
      # of a hang is to see WHERE it hung.
      - name: 'Backend 2 conformance: window, present, pixels, input, teardown'
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/shots /tmp/lldb
          status=0
          CONFORMANCE_SHOTS=/tmp/shots ./build/probe conformance-signal \
            > /tmp/conformance-signal.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "conformance-signal still running after 60s; sampling"
            sample "$pid" 2 1 -file /tmp/lldb/conformance-signal.sample || true
            kill -9 "$pid" 2>/dev/null || true
            status=124
          fi
          wait "$pid" 2>/dev/null || rc=$?
          [ "$status" -eq 124 ] || status=${rc:-0}
          cat /tmp/conformance-signal.log
          echo "exit=$status"
          if [ -f /tmp/lldb/conformance-signal.sample ]; then
            echo "----- main thread -----"
            grep -A 24 "com.apple.main-thread" \
              /tmp/lldb/conformance-signal.sample | head -30 || true
            echo "----- all threads (call graph head) -----"
            head -120 /tmp/lldb/conformance-signal.sample || true
          fi
          grep -Eq '^WINDOW_ID=[1-9][0-9]*$' /tmp/conformance-signal.log
          grep -q '^PRESENT=PASS$' /tmp/conformance-signal.log
          grep -q '^PIXEL_WITNESS=PASS' /tmp/conformance-signal.log
          grep -Eq '^INPUT_EVENTS=[1-9][0-9]*$' /tmp/conformance-signal.log
          grep -q '^TEARDOWN=PASS$' /tmp/conformance-signal.log
          grep -q '^RESPONDER_INPUT=1$' /tmp/conformance-signal.log
          grep -q '^CONFORMANCE=PASS$' /tmp/conformance-signal.log
          [ "$status" -eq 0 ]

      # One table for the three backends, so the comparison is a fact in the
      # job summary rather than something to reconstruct from three step logs.
      - name: 'Three-backend conformance summary'
        if: always()
        run: |
          row() {
            local name="$1" file="$2"
            if [ ! -f "$file" ]; then
              printf '| %s | %s |\n' "$name" 'no log' >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            local wid present pixel input teardown result
            wid=$(grep -m1 '^WINDOW_ID=' "$file" | cut -d= -f2)
            present=$(grep -m1 '^PRESENT=' "$file" | cut -d= -f2)
            pixel=$(grep -m1 '^PIXEL_WITNESS=' "$file" | cut -d' ' -f1-2 \
              | sed 's/PIXEL_WITNESS=//')
            input=$(grep -m1 '^INPUT_EVENTS=' "$file" | cut -d= -f2)
            teardown=$(grep -m1 '^TEARDOWN=' "$file" | cut -d= -f2)
            result=$(grep -m1 '^CONFORMANCE=' "$file" | cut -d= -f2)
            printf '| %s | %s | %s | %s | %s | %s | %s |\n' \
              "$name" "${wid:-none}" "${present:-none}" "${pixel:-none}" \
              "${input:-0}" "${teardown:-none}" "${result:-none}" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          }
          {
            echo '## macOS three-backend conformance'
            echo
            echo '| backend | window | present | pixel witness | input | teardown | result |'
            echo '|---|---|---|---|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          row skylight /tmp/conformance-skylight.log
          row appkitSignal /tmp/conformance-signal.log
          row appkitNativeHost /tmp/conformance-native-host.log

      # Runs whether or not the gate above passed: when it hangs this is the
      # only thing that says which frame is stuck, and SIGUSR2 must be passed
      # through or the session dies at the hijack instead of at the bug.
      - name: 'lldb: where backend 2 conformance stops'
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p /tmp/lldb
          perl -e 'alarm shift; exec @ARGV' 90 lldb --batch \
            -o "process handle SIGUSR2 -n false -p true -s false" \
            -o "run conformance-signal" \
            -o "thread backtrace all" \
            -o "quit" \
            ./build/probe 2>&1 \
            | tee /tmp/lldb/conformance-signal.txt || echo "lldb exit=$?"
          echo "----- tail -----"
          tail -120 /tmp/lldb/conformance-signal.txt || true

      - name: 'Probe E: NSWindow on the hijacked main thread via NSInvocation'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe mainthread-window || echo "exit=$?"

      - name: 'Probe G: [NSApp run] on the hijacked main thread'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe nsapp-run-main || echo "exit=$?"

      # SkyLight lives in the dyld shared cache, so there is no file to nm(1).
      # dyld_info reads the cache and gives the real export names instead of
      # letting us guess them one dlsym at a time.
      - name: 'Discovery: SkyLight exports (region / window)'
        timeout-minutes: 3
        run: |
          SKYLIGHT=/System/Library/PrivateFrameworks/SkyLight.framework/SkyLight
          echo "----- region constructors -----"
          dyld_info -exports "$SKYLIGHT" | grep -iE "region" | head -40 || echo "exit=$?"
          echo "----- window creation -----"
          dyld_info -exports "$SKYLIGHT" | grep -iE "NewWindow|WindowContext|SetWindowShape" | head -40 || echo "exit=$?"

      - name: 'Probe H: window straight from the WindowServer (no AppKit)'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe skylight-window || echo "exit=$?"

      - name: 'Probe I: does the Dart runtime survive losing thread 0?'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe vm-health || echo "exit=$?"

      - name: 'Probe J: UI -> Dart, a main-thread call reaching the isolate'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe reverse-channel || echo "exit=$?"

      # Route C is proven for output but has no input yet. AppKit itself gets
      # events from the WindowServer connection, so the delivery API is in here
      # somewhere - find its real name rather than guessing.
      - name: 'Discovery: SkyLight event delivery API'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          SKYLIGHT=/System/Library/PrivateFrameworks/SkyLight.framework/SkyLight
          echo "----- event ports and records -----"
          dyld_info -exports "$SKYLIGHT" \
            | grep -iE "EventPort|EventRecord|NextEvent|EventTap|RegisterEvent" \
            | head -40
          echo "----- other event entry points -----"
          dyld_info -exports "$SKYLIGHT" \
            | grep -iE "_SLSEvent|_SLEvent|SetEventMask|EventMask" | head -40
          # Probe P got zero events: the WindowServer routes input to the front
          # PROCESS, and ours never registered as one. This is that layer.
          echo "----- process registration (PSN / front / activate) -----"
          dyld_info -exports "$SKYLIGHT" \
            | grep -iE "_SLPS|SetFrontProcess|RegisterConnection|ConnectionProperty|Activate" \
            | head -50

      - name: 'Probe M: draw pixels into the WindowServer window'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe skylight-draw || echo "exit=$?"

      # Everything else is self-reported. screencapture(1) can photograph a
      # window by its CGSWindowID, which only works if the WindowServer really
      # has it - an external witness the probe cannot fake.
      - name: 'Probe N: screenshot the WindowServer window from outside'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          ./build/probe hold-skylight 20 > /tmp/hold-skylight.log 2>&1 &
          sleep 4
          cat /tmp/hold-skylight.log
          WID=$(grep -o 'WINDOW_ID=[0-9]*' /tmp/hold-skylight.log | cut -d= -f2)
          echo "aiming screencapture at window id '$WID'"
          screencapture -x -o -l"$WID" /tmp/shots/skylight-window.png \
            || echo "screencapture -l exit=$?"
          screencapture -x /tmp/shots/skylight-screen.png \
            || echo "screencapture screen exit=$?"
          ls -la /tmp/shots/ || true
          for f in /tmp/shots/*.png; do
            [ -f "$f" ] && sips -g pixelWidth -g pixelHeight "$f" 2>/dev/null || true
          done
          wait

      - name: 'Probe O: inject keyboard/mouse from a second process'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          ./build/probe hold-appkit 20 > /tmp/hold-appkit.log 2>&1 &
          sleep 5
          echo "----- holder so far -----"
          cat /tmp/hold-appkit.log
          WID=$(grep -o 'WINDOW_ID=[0-9]*' /tmp/hold-appkit.log | cut -d= -f2)
          echo "----- capturing NSWindow $WID -----"
          screencapture -x -o -l"$WID" /tmp/shots/appkit-window.png \
            || echo "screencapture -l exit=$?"
          echo "----- injecting input from a second process -----"
          ./build/probe post-input || echo "post-input exit=$?"
          sleep 4
          ./build/probe post-input || echo "post-input exit=$?"
          wait
          echo "----- holder final -----"
          cat /tmp/hold-appkit.log
          ls -la /tmp/shots/ || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-screenshots
          path: /tmp/shots/
          if-no-files-found: warn
          retention-days: 7

      # Z1 fixes SLEventCreateNextEvent(cid). Z2 installs the Mach event port as
      # a CFRunLoopSource. Z17 registers the process before its first window,
      # matching AppKit/HIServices ordering, then performs bounded reads.
      # Superseded by "Backend 1 conformance", which tests strictly more of the
      # same route. Kept as a diagnostic because it fails in a specific and
      # still-unexplained way: late in the job the FIRST
      # SLPSRegisterWithServer returns -50, the retry returns 0, and the
      # WindowServer then delivers nothing. The gated late re-run below exists
      # to find out whether the backend shares that weakness.
      - name: 'Probe Z1/Z2/Z17: register before window and receive input'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots
          OBJC_DEBUG_MISSING_POOLS=YES ./build/probe skylight-events 8 > /tmp/events.log 2>&1 &
          pid=$!
          sleep 3
          WID=$(grep -o 'WINDOW_ID=[0-9]*' /tmp/events.log | cut -d= -f2)
          echo "holder window: $WID"
          if [[ -n "$WID" ]]; then
            screencapture -x -o -l"$WID" /tmp/shots/skylight-events-window.png \
              || echo "screencapture -l exit=$?"
          fi
          ./build/probe post-input > /dev/null 2>&1 || echo "post exit=$?"
          for i in {1..40}; do
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "probe exceeded hard cap; sampling and killing pid=$pid"
            sample "$pid" 1 1 -file /tmp/events.sample || true
            kill -9 "$pid" 2>/dev/null || true
          fi
          status=0
          wait "$pid" || status=$?
          cat /tmp/events.log || true
          if grep -q 'MISSING POOLS' /tmp/events.log; then
            echo 'autorelease-pool regression detected'
            status=1
          fi
          if ! grep -Eq 'events received: [1-9][0-9]*' /tmp/events.log; then
            echo 'SkyLight input regression: no event was received'
            status=1
          fi
          grep -A 16 "com.apple.main-thread" /tmp/events.sample 2>/dev/null | head -24 || true
          exit "$status"

      # Backend 1 receives keyDown/keyUp but never pointerMove, while the
      # native host - a normal AppKit app with acceptsMouseMovedEvents - gets
      # all three. So AppKit tells the WindowServer something we do not. Break
      # on every SkyLight event-mask entry point in that host and read what it
      # passes.
      - name: 'Discovery: how AppKit asks for mouse-moved events'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          mkdir -p /tmp/lldb
          SKYLIGHT=/System/Library/PrivateFrameworks/SkyLight.framework/SkyLight
          echo "----- exported event-mask / tag symbols -----"
          dyld_info -exports "$SKYLIGHT" \
            | grep -iE "EventMask|MouseMoved|WindowTags|SetWindowProperty" \
            | head -60
          echo "----- what the AppKit host calls -----"
          perl -e 'alarm shift; exec @ARGV' 120 lldb --batch \
            -o "breakpoint set --regex '^_?SLS[A-Za-z]*EventMask$'" \
            -o "breakpoint set --regex '^_?SLSSetWindowTags$'" \
            -o "run --smoke-seconds 2" \
            -o "register read x0 x1 x2 x3 x4" \
            -o "bt" \
            -o "continue" \
            -o "register read x0 x1 x2 x3 x4" \
            -o "bt" \
            -o "continue" \
            ./build/minimal_appkit_host 2>&1 \
            | tee /tmp/lldb/appkit-event-mask.txt || echo "lldb exit=$?"
          echo "----- tail -----"
          tail -80 /tmp/lldb/appkit-event-mask.txt || true

      - name: 'lldb: recover SLPSRegisterWithServer ABI from macOS 14'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          lldb --batch \
            -o "breakpoint set --name SLPSRegisterWithServer" \
            -o "run skylight-events 1" \
            -o "register read x0 x1 x2 x3 x4 x5 x6 x7" \
            -o "disassemble --name SLPSRegisterWithServer" \
            -o "bt" \
            ./build/probe 2>&1 | tee /tmp/slps-register-lldb.txt || true
          echo "===== arguments passed by AppKit to _SLPSRegisterWithServer ====="
          lldb --batch \
            -o "process handle SIGUSR2 -n false -p true -s false" \
            -o "breakpoint set --name _SLPSRegisterWithServer" \
            -o "run hold-appkit-nopump 2" \
            -o "register read x0 x1 x2 x3 x4 x5 x6 x7" \
            -o "disassemble --name _SLPSRegisterWithServer" \
            -o "bt" \
            ./build/probe 2>&1 | tee /tmp/slps-register-appkit-lldb.txt || true
          echo "===== SLPSSetMainApplicationConnection called by AppKit ====="
          lldb --batch \
            -o "process handle SIGUSR2 -n false -p true -s false" \
            -o "breakpoint set --name SLPSSetMainApplicationConnection" \
            -o "run hold-appkit-nopump 2" \
            -o "register read x0 x1 x2 x3 x4 x5 x6 x7" \
            -o "disassemble --name SLPSSetMainApplicationConnection" \
            -o "bt" \
            ./build/probe 2>&1 | tee /tmp/slps-set-main-appkit-lldb.txt || true
          echo "===== direct disassembly: SLPSSetMainApplicationConnection ====="
          lldb --batch \
            -o "breakpoint set --name SLSGetEventPort" \
            -o "run skylight-events 1" \
            -o "disassemble --name SLPSSetMainApplicationConnection" \
            -o "image lookup --verbose --name SLPSSetMainApplicationConnection" \
            -o "bt" \
            ./build/probe 2>&1 | tee /tmp/slps-set-main-disassembly.txt || true

      # Probe L supersedes K: one-shot timers, a sentinel in the return buffer,
      # a marker timer, and the real NSDefaultRunLoopMode. sample(1) reads the
      # main thread's stack while it runs, which is what tells "timer never
      # delivered" apart from "pump blocked inside _DPSNextEvent".
      # Sample AFTER the pump is due (100ms) so a block shows _DPSNextEvent.
      - name: 'Probe L: unambiguous timer/pump diagnostic + stack sample'
        timeout-minutes: 4
        continue-on-error: true
        run: |
          ./build/probe pump-timer-diagnostic > /tmp/probe-l.log 2>&1 &
          pid=$!
          sleep 0.5
          sample "$pid" 1 1 -file /tmp/probe-l.sample || echo "sample exit=$?"
          sleep 4
          echo "----- probe output -----"
          cat /tmp/probe-l.log || true
          echo "----- main thread stack -----"
          grep -A 20 "com.apple.main-thread" /tmp/probe-l.sample | head -30 || true
          kill -9 "$pid" 2>/dev/null || true

      # The stack sample showed the main thread never stayed in CFRunLoopRun -
      # it was in Dart_RunLoop -> pthread_cond_wait for 612 of 612 samples. This
      # gives the loop a source so it cannot finish.
      - name: 'Probe R: keep the parked run loop alive with a dummy source'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          ./build/probe keepalive-hijack > /tmp/probe-r.log 2>&1 &
          pid=$!
          sleep 2
          sample "$pid" 1 1 -file /tmp/probe-r.sample || echo "sample exit=$?"
          sleep 4
          echo "----- probe output -----"
          cat /tmp/probe-r.log || true
          echo "----- main thread stack -----"
          grep -A 14 "com.apple.main-thread" /tmp/probe-r.sample | head -20 || true
          kill -9 "$pid" 2>/dev/null || true

      # R saw 34 timer ticks after parking; K saw zero after parking the same
      # way. The only difference is the AppKit initialisation in between, so one
      # of those calls is what kills the loop. This bisects it with a running
      # tick counter.
      - name: 'Probe T: which AppKit call kills the run loop?'
        timeout-minutes: 3
        continue-on-error: true
        run: ./build/probe appkit-bisect || echo "exit=$?"

      # O crashed at the same Trace/BPT address as G after starting the pump.
      # Hold the window with only a witness timer - no nextEvent - to see which
      # of the two is the killer.
      - name: 'Probe U: hold NSWindow with NO nextEvent pump'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          ./build/probe hold-appkit-nopump 8 > /tmp/probe-u.log 2>&1 &
          pid=$!
          sleep 2
          sample "$pid" 1 1 -file /tmp/probe-u.sample || echo "sample exit=$?"
          sleep 8
          echo "----- probe output -----"
          cat /tmp/probe-u.log || true
          echo "----- main thread stack -----"
          grep -A 16 "com.apple.main-thread" /tmp/probe-u.sample | head -24 || true
          kill -9 "$pid" 2>/dev/null || true

      # Q/X/Y remain available as manual subcommands for historical comparison,
      # but are no longer in the default run. In run 31154591354, registering
      # eventPort was the only new successful call before the stream opened;
      # Z1/Z2/Z3 now isolates that candidate without foreground/PSN setup.

      # K/F can hang the Dart thread if waitUntilDone meets a wedged main.
      # Always background + sample + hard kill so the step cannot eat the job.
      - name: 'Probe K: pump the event queue from an NSTimer instead'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          ./build/probe pump-timer > /tmp/probe-k.log 2>&1 &
          pid=$!
          sleep 2
          sample "$pid" 1 1 -file /tmp/probe-k.sample || echo "sample exit=$?"
          sleep 3
          echo "----- probe K output -----"
          cat /tmp/probe-k.log || true
          echo "----- main thread stack -----"
          grep -A 20 "com.apple.main-thread" /tmp/probe-k.sample | head -30 || true
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      - name: 'Probe F: post an NSEvent and pump it back'
        timeout-minutes: 2
        continue-on-error: true
        run: |
          ./build/probe event-pump > /tmp/probe-f.log 2>&1 &
          pid=$!
          sleep 2
          sample "$pid" 1 1 -file /tmp/probe-f.sample || echo "sample exit=$?"
          sleep 3
          echo "----- probe F output -----"
          cat /tmp/probe-f.log || true
          echo "----- main thread stack -----"
          grep -A 20 "com.apple.main-thread" /tmp/probe-f.sample | head -30 || true
          kill -9 "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

      # Batch lldb on the AOT exe. Interactive debug is awkward on GHA, but
      # crash backtraces work. Each run is hard-capped with timeout(1).
      # Dart frames often show as ???; AppKit/CoreFoundation symbolicate.
      - name: 'lldb: backtrace pump-timer (K), event-pump (F), hold-appkit (O)'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p /tmp/lldb
          echo "===== lldb CFRunLoopRun entry and normal return ====="
          perl -e 'alarm shift; exec @ARGV' 30 lldb --batch \
            -o "process handle SIGUSR2 -n false -p true -s false" \
            -o "breakpoint set --name CFRunLoopRun" \
            -o "run graceful-hijack-shutdown" \
            -o "thread list" \
            -o "thread backtrace" \
            -o "thread step-out" \
            -o "thread backtrace" \
            -o "continue" \
            ./build/probe 2>&1 \
            | tee /tmp/lldb/graceful-hijack-return.txt \
            || echo "lldb/timeout exit=$?"
          run_lldb() {
            local name="$1"
            shift
            echo "===== lldb $name ====="
            # macOS has no GNU timeout(1); cap with perl alarm instead so a
            # hung probe cannot wedge the step.
            # SIGUSR2 is OUR hijack signal (handler = CFRunLoopRun). lldb must
            # PASS it without stopping, or the session dies at park and never
            # reaches the real crash. Stop only on fatal faults.
            perl -e 'alarm shift; exec @ARGV' 30 lldb --batch \
              -o "process handle SIGUSR2 -n false -p true -s false" \
              -o "process handle SIGSEGV -n true  -p true -s true" \
              -o "process handle SIGBUS  -n true  -p true -s true" \
              -o "process handle SIGTRAP -n true  -p true -s true" \
              -o "process handle SIGABRT -n true  -p true -s true" \
              -o "run $*" \
              -o "bt" \
              -o "thread backtrace all" \
              -o "quit" \
              ./build/probe 2>&1 | tee "/tmp/lldb/${name}.txt" || echo "lldb/timeout exit=$?"
            echo "----- tail $name -----"
            tail -100 "/tmp/lldb/${name}.txt" || true
          }
          run_lldb pump-timer pump-timer
          run_lldb event-pump event-pump
          run_lldb hold-appkit hold-appkit 4

      # Backend 1 always registers on the first attempt when it runs early. This
      # runs the identical binary at the END of the job, in the environment
      # where the Z17 probe fails, so "the backend is robust" is measured
      # rather than assumed.
      - name: 'Backend 1 conformance again, late in the job'
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/shots
          status=0
          OBJC_DEBUG_MISSING_POOLS=YES CONFORMANCE_SHOTS=/tmp/shots             ./build/conformance skylight             > /tmp/conformance-skylight-late.log 2>&1 || status=$?
          cat /tmp/conformance-skylight-late.log
          echo "exit=$status"
          grep -q '^PRESENT=PASS$' /tmp/conformance-skylight-late.log
          grep -q '^PIXEL_WITNESS=PASS' /tmp/conformance-skylight-late.log
          grep -Eq '^INPUT_EVENTS=[1-9][0-9]*$'             /tmp/conformance-skylight-late.log
          grep -q '^CONFORMANCE=PASS$' /tmp/conformance-skylight-late.log
          [ "$status" -eq 0 ]

      - name: Upload lldb traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-lldb-traces
          path: /tmp/lldb/
          if-no-files-found: warn
          retention-days: 7
