# Ground truth for Metal *presentation* on a real Apple Silicon runner.
#
# Separate from `metal_mesh_abi_probe.yml` because it answers a different
# question. That workflow proves Metal draws: a device, 27 verified selector
# encodings, a compiled MSL pipeline, meshes rendered and read back offscreen.
# This one asks whether a drawn frame can reach a surface a window could show,
# which is the one gate §21.6 of the roadmap still has open.
#
# ## The gates, and when each one earned its place
#
# This file landed with almost nothing asserted, because the three sends it
# exercises had never run anywhere and a `grep` demanding them would have been
# asserting the conclusion under measurement. Run 34165428755 answered all
# three - the IOSurface wraps under MTLStorageModeShared, the block fires at
# 6.7 ms, and the bytes read back in the right order - so they are gates now.
# That is the promise the first revision made: an answer becomes a gate, and
# from then on red means regression instead of ignorance.
#
# `CAMETALLAYER_PRESENTER` is the exception and stays ungated. It reports
# whether a detached layer can vend a drawable, which is a fact about the
# runner rather than about this repository: no macOS backend in `lib/` creates
# a window in this process for a layer to live in, so green there buys no
# presenter and red there breaks nothing.
name: Metal presentation probe

on:
  # Unfiltered, so the probe can always be re-run by hand against a commit
  # that changed nothing - which is how a flaky or environment-dependent
  # answer gets told apart from a real one.
  workflow_dispatch:
  push:
    # Scoped so an unrelated commit does not spend a macOS runner. These are
    # the paths that can change the answer: the Metal backend, the macOS
    # window backend that owns the IOSurface pool, the Objective-C send and
    # block layer the probe drives, and the probe itself.
    paths:
      - 'lib/src/rendering/gpu/metal/**'
      - 'lib/src/backends/macos/**'
      - 'lib/src/ffi/objc_runtime.dart'
      - 'tool/metal_present_probe.dart'
      - '.github/workflows/metal_present_probe.yml'

permissions:
  contents: read

concurrency:
  group: metal-present-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  DART_SDK_VERSION: '3.6.2'

jobs:
  probe:
    name: Metal presentation ABI (macOS ARM64)
    runs-on: macos-14
    # The layer group runs last precisely because `-[CAMetalLayer
    # nextDrawable]` can block when no drawable can be vended; ten minutes is
    # far more than the rest of the probe needs and bounds that case.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Report runner architecture
        run: |
          uname -a
          uname -m | grep -q '^arm64$'

      # OBJC_DEBUG_MISSING_POOLS makes the runtime print when an object is
      # autoreleased with no enclosing pool. It matters here more than in most
      # places: this probe is the first code in the repository to hand Metal a
      # block, and the completion handler runs on a thread that has no pool of
      # ours at all.
      - name: Exercise the Metal presentation path
        shell: bash
        env:
          OBJC_DEBUG_MISSING_POOLS: 'YES'
        run: |
          set -o pipefail
          mkdir -p build
          dart run tool/metal_present_probe.dart 2>&1 \
            | tee build/metal-present-probe.log

      # Everything run 34165428755 established. `fail=0` rather than a count
      # of successes, so adding a check to the probe does not make this red for
      # the wrong reason - what must not regress is that nothing fails.
      - name: Assert the presentation ABI
        shell: bash
        run: |
          grep -q '^MTLCreateSystemDefaultDevice=NON_NIL$'             build/metal-present-probe.log
          grep -q '^CHECK=device RESULT=OK ' build/metal-present-probe.log
          grep -q '^ADR0005_IOSURFACE_BRIDGE=OK ' build/metal-present-probe.log
          grep -q '^ADR0005_COMPLETION_HANDLER=OK '             build/metal-present-probe.log
          grep -q ' fail=0 ' build/metal-present-probe.log
          grep -q '^METAL_PRESENT_PROBE=DONE ' build/metal-present-probe.log

      # The AppKit host, without which there is no window to present into. The
      # same build script macos_popup_probe.yml uses, so a break in it shows up
      # in both rather than only here.
      - name: Build the production AppKit host
        run: bash lib/src/backends/macos/native/build_host.sh

      # The end-to-end proof, and the one that cannot be faked. Everything
      # above runs against surfaces this process made for itself; this runs
      # against a real NSWindow on a real screen, with onError attached, and
      # then reads the presented IOSurface back with the CPU to check *which*
      # pixels are in it. A headless run that never presented would be a false
      # green, which is a standing rule in this repository.
      - name: Present into a real window and read the pixels back
        shell: bash
        env:
          OBJC_DEBUG_MISSING_POOLS: 'YES'
          DART_UI_MACOS_HOST: >-
            ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: |
          set -o pipefail
          dart run tool/metal_window_present_probe.dart 2>&1             | tee build/metal-window-present-probe.log
          # SKIP is not success here. This runner has a WindowServer session -
          # macos_popup_probe.yml proves it with real NSPanels - so anything
          # short of PASS means the path broke, not that the machine cannot
          # host the run.
          grep -q '^METAL_WINDOW_PRESENT=PASS$'             build/metal-window-present-probe.log
          grep -q '^APP presentation=metal$'             build/metal-window-present-probe.log
          grep -q '^CHECK=non_blank RESULT=OK '             build/metal-window-present-probe.log
          grep -q '^CHECK=pixel_inside_rect RESULT=OK'             build/metal-window-present-probe.log
          grep -q '^CHECK=pixel_outside_rect RESULT=OK'             build/metal-window-present-probe.log

      # Printed, never gated. These three lines are the whole reason the
      # workflow exists, and reading them out of the step summary beats
      # scrolling a log.
      - name: Report the verdicts
        if: always()
        shell: bash
        run: |
          {
            echo '### Metal presentation verdicts'
            echo ''
            echo '```'
            grep -E '^(ADR0005_|CAMETALLAYER_PRESENTER=|DEVICE_|IOSURFACE_|COMPLETION_HANDLER_|METAL_PRESENT_PROBE=)' \
              build/metal-present-probe.log || echo 'no verdict lines found'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-present-probe
          path: build/metal-*-probe.log
          retention-days: 14
          if-no-files-found: warn
