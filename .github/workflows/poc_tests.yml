# Testes específicos dos POCs — separados para não bloquear CI principal
name: POC Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'poc/**'
      - 'mvp/**'
      - '.github/workflows/poc_tests.yml'
  pull_request:
    paths:
      - 'poc/**'
      - 'mvp/**'
  workflow_dispatch:

concurrency:
  group: poc-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: '3.6.0'

jobs:
  # ==============================================================
  # POC-01: Win32 Window (Windows only)
  # ==============================================================
  poc-01-win32:
    name: 'POC-01: Win32 Window'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_01_win32_window
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_01_win32_window
        run: dart analyze

      - name: Run tests
        working-directory: poc/poc_01_win32_window
        run: dart test

      - name: AOT compile
        working-directory: poc/poc_01_win32_window
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/poc_01.exe

      - name: Smoke test
        working-directory: poc/poc_01_win32_window
        shell: powershell
        run: |
          $proc = Start-Process -FilePath "build\poc_01.exe" `
            -ArgumentList "--smoke-test" -PassThru
          $proc | Wait-Process -Timeout 15 -ErrorAction SilentlyContinue
          if (!$proc.HasExited) {
            $proc | Stop-Process -Force
            throw "POC-01 smoke test timed out."
          }
          if ($proc.ExitCode -ne 0) {
            throw "POC-01 smoke test failed with exit code $($proc.ExitCode)."
          }
          Write-Host "Exit code: $($proc.ExitCode)"

  # ==============================================================
  # POC-02: X11/XCB Window (Linux only)
  # ==============================================================
  poc-02-x11:
    name: 'POC-02: X11 Window'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils \
            libxcb1-dev libxcb-shm0-dev libxcb-keysyms1-dev \
            libxcb-icccm4-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install dependencies
        working-directory: poc/poc_02_x11_window
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_02_x11_window
        run: dart analyze

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          xdpyinfo -display :99 | head -3

      - name: Run tests
        working-directory: poc/poc_02_x11_window
        run: dart test
        env:
          DISPLAY: ':99'

      - name: AOT compile and smoke test
        working-directory: poc/poc_02_x11_window
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o build/poc_02
          chmod +x build/poc_02
          timeout 10 ./build/poc_02 --smoke-test
        env:
          DISPLAY: ':99'

  # ==============================================================
  # POC-03: AppKit Window (macOS only)
  # ==============================================================
  poc-03-appkit:
    name: 'POC-03: AppKit Window'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_03_appkit_window
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_03_appkit_window
        run: dart analyze

      - name: Run tests
        working-directory: poc/poc_03_appkit_window
        run: dart test

      # Step-level cap: macOS runners have no GNU `timeout`, and a blocked
      # AppKit call must not eat the job budget again.
      - name: AOT compile and smoke test
        working-directory: poc/poc_03_appkit_window
        timeout-minutes: 3
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o build/poc_03
          chmod +x build/poc_03
          ./build/poc_03 --smoke-test

  # ==============================================================
  # POC-04: CPU Rasterization (all platforms)
  # ==============================================================
  poc-04-cpu-raster:
    name: 'POC-04: CPU Raster (${{ matrix.platform }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_04_cpu_raster
        run: dart pub get

      - name: Run benchmark
        working-directory: poc/poc_04_cpu_raster
        shell: bash
        run: dart run bin/main.dart --benchmark

      - name: Run tests
        working-directory: poc/poc_04_cpu_raster
        run: dart test

      - name: Upload output images
        uses: actions/upload-artifact@v4
        with:
          name: poc04-output-${{ matrix.platform }}
          path: poc/poc_04_cpu_raster/output/
          retention-days: 7
          if-no-files-found: ignore

  # ==============================================================
  # POC-05: COM/Direct2D (Windows only)
  # ==============================================================
  poc-05-com-d2d:
    name: 'POC-05: COM/Direct2D'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_05_com_direct2d
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_05_com_direct2d
        run: dart analyze

      - name: Run tests
        working-directory: poc/poc_05_com_direct2d
        run: dart test

      - name: AOT compile and COM smoke test
        working-directory: poc/poc_05_com_direct2d
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/poc_05.exe
          & .\build\poc_05.exe
          if ($LASTEXITCODE -ne 0) {
            throw "POC-05 AOT smoke failed with exit code $LASTEXITCODE."
          }

  # ==============================================================
  # POC-06: OpenGL (Linux only)
  # ==============================================================
  poc-06-opengl:
    name: 'POC-06: OpenGL'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libxcb1-dev mesa-utils x11-utils

      - name: Install dependencies
        working-directory: poc/poc_06_opengl
        run: dart pub get

      - name: Start Xvfb and run tests
        working-directory: poc/poc_06_opengl
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          sleep 2
          glxinfo -display :99 | head -10 || true
          dart test
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'

      - name: AOT compile and OpenGL smoke test
        working-directory: poc/poc_06_opengl
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o build/poc_06
          chmod +x build/poc_06
          ./build/poc_06 --smoke-test
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'

  # ==============================================================
  # POC-07: Metal (macOS only)
  # ==============================================================
  poc-07-metal:
    name: 'POC-07: Metal'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_07_metal
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_07_metal
        run: dart analyze

      - name: Run tests
        working-directory: poc/poc_07_metal
        run: dart test

      - name: AOT compile and smoke test
        working-directory: poc/poc_07_metal
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o build/poc_07
          chmod +x build/poc_07
          ./build/poc_07 --smoke-test

  # ==============================================================
  # POC-08: Vulkan (Linux + Windows)
  # ==============================================================
  poc-08-vulkan:
    name: 'POC-08: Vulkan (${{ matrix.platform }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install Vulkan (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-tools
          VULKAN_ICD=$(find /usr/share/vulkan/icd.d -type f -name '*lvp*json' -print -quit)
          test -n "$VULKAN_ICD"
          echo "VULKAN_ICD=$VULKAN_ICD" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$VULKAN_ICD" vulkaninfo --summary

      - name: Install dependencies
        working-directory: poc/poc_08_vulkan
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_08_vulkan
        run: dart analyze

      - name: Run tests
        working-directory: poc/poc_08_vulkan
        run: dart test

      - name: AOT compile
        working-directory: poc/poc_08_vulkan
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o "build/poc_08${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Stage vendored Vulkan loader (Windows)
        if: matrix.platform == 'windows'
        working-directory: poc/poc_08_vulkan
        shell: powershell
        run: |
          # Copy the vendored Vulkan loader + SwiftShader ICD next to the AOT
          # binary so the smoke test has a software-rendering fallback even on
          # runners without a native Vulkan driver.
          Copy-Item -LiteralPath vendor\vulkan-1.dll -Destination build\vulkan-1.dll -Force
          Copy-Item -LiteralPath vendor\vk_swiftshader.dll -Destination build\vk_swiftshader.dll -Force
          Copy-Item -LiteralPath vendor\vk_swiftshader_icd.json -Destination build\vk_swiftshader_icd.json -Force
          Get-ChildItem build | Select-Object Name, Length | Format-Table -AutoSize

      - name: Run smoke test (Linux)
        if: matrix.platform == 'linux'
        working-directory: poc/poc_08_vulkan
        run: |
          VK_DRIVER_FILES="$VULKAN_ICD" ./build/poc_08 --smoke-test

      - name: Run smoke test (Windows)
        if: matrix.platform == 'windows'
        working-directory: poc/poc_08_vulkan
        shell: powershell
        run: |
          # Prepend the build directory so the vendored vulkan-1.dll loads
          # instead of any system copy, and point VK_ICD_FILENAMES at the
          # SwiftShader manifest (its `library_path` is relative to the JSON).
          $env:VK_ICD_FILENAMES = "$PWD\build\vk_swiftshader_icd.json"
          $env:Path = "$PWD\build;$env:Path"
          & .\build\poc_08.exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "POC-08 Windows smoke failed with exit code $LASTEXITCODE."
          }
          Write-Host "Exit code: $LASTEXITCODE"

  # ==============================================================
  # POC-09: Wayland (Linux only)
  # ==============================================================
  poc-09-wayland:
    name: 'POC-09: Wayland'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install Wayland dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libwayland-client0 \
            weston libxkbcommon-dev

      - name: Install dependencies
        working-directory: poc/poc_09_wayland
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_09_wayland
        run: dart analyze

      - name: Run binding tests
        working-directory: poc/poc_09_wayland
        run: dart test

      - name: Start Weston headless and run smoke test
        working-directory: poc/poc_09_wayland
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o build/poc_09
          chmod +x build/poc_09
          mkdir -p /tmp/weston-poc09
          chmod 700 /tmp/weston-poc09
          export XDG_RUNTIME_DIR=/tmp/weston-poc09
          # Name the socket explicitly: with wl_display_add_socket_auto() the
          # compositor picks the first free wayland-N, so a hardcoded
          # WAYLAND_DISPLAY=wayland-0 is a guess, not a contract.
          export WAYLAND_DISPLAY=wayland-poc09
          weston --backend=headless --no-config --socket="$WAYLAND_DISPLAY" &
          WESTON_PID=$!
          trap 'kill $WESTON_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
            sleep 0.25
          done
          if ! test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then
            echo "::error::Weston never created $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            ls -la "$XDG_RUNTIME_DIR" || true
            exit 1
          fi
          timeout 10 ./build/poc_09 --smoke-test
          kill $WESTON_PID 2>/dev/null || true
        env:
          XDG_RUNTIME_DIR: /tmp/weston-poc09

  # ==============================================================
  # POC-10: Event Loop (Windows implementation)
  # ==============================================================
  poc-10-event-loop:
    name: 'POC-10: Event Loop (Windows)'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_10_event_loop
        run: dart pub get

      - name: Run tests
        working-directory: poc/poc_10_event_loop
        run: dart test

      - name: AOT compile and event-loop smoke test
        working-directory: poc/poc_10_event_loop
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/poc_10.exe
          & .\build\poc_10.exe
          if ($LASTEXITCODE -ne 0) {
            throw "POC-10 AOT smoke failed with exit code $LASTEXITCODE."
          }

  # ==============================================================
  # POC-11: Responsive UI + streamed image download (Windows)
  # ==============================================================
  poc-11-async-download:
    name: 'POC-11: Async image download UI'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_11_async_image_download
        run: dart pub get

      - name: Analyze
        working-directory: poc/poc_11_async_image_download
        run: dart analyze

      - name: Test streamed download and decoding
        working-directory: poc/poc_11_async_image_download
        run: dart test

      - name: AOT compile and responsive UI smoke test
        working-directory: poc/poc_11_async_image_download
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/poc_11.exe
          $proc = Start-Process -FilePath "build\poc_11.exe" `
            -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          $proc | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          if (!$proc.HasExited) {
            $proc | Stop-Process -Force
            throw "POC-11 smoke test timed out; the UI event loop may be blocked."
          }
          if ($proc.ExitCode -ne 0) {
            throw "POC-11 smoke test failed with exit code $($proc.ExitCode)."
          }

  # ==============================================================
  # POC-12: Dart heap vs FFI-native pixel buffers (all platforms)
  # ==============================================================
  poc-12-native-buffers:
    name: 'POC-12: Native buffers (${{ matrix.platform }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_12_native_buffers
        run: dart pub get

      - name: Analyze and test native allocation lifecycle
        working-directory: poc/poc_12_native_buffers
        run: |
          dart analyze
          dart test

      - name: Compile AOT benchmark
        working-directory: poc/poc_12_native_buffers
        shell: bash
        run: |
          mkdir -p build
          dart compile exe bin/main.dart -o "build/poc_12${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Run AOT native-buffer benchmark
        working-directory: poc/poc_12_native_buffers
        shell: bash
        run: |
          "./build/poc_12${{ runner.os == 'Windows' && '.exe' || '' }}" --ci | tee build/benchmark.txt

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: poc12-native-buffer-${{ matrix.platform }}
          path: poc/poc_12_native_buffers/build/benchmark.txt
          retention-days: 7

  # ==============================================================
  # POC-13: Persistent native DIB presentation (Windows)
  # ==============================================================
  poc-13-native-dib:
    name: 'POC-13: Native DIB presentation'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        working-directory: poc/poc_13_native_dib_present
        run: dart pub get

      - name: Analyze and test metrics
        working-directory: poc/poc_13_native_dib_present
        run: |
          dart analyze
          dart test

      - name: Compile AOT benchmark
        working-directory: poc/poc_13_native_dib_present
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/poc_13.exe

      - name: Compare copied and persistent-DIB pipelines
        working-directory: poc/poc_13_native_dib_present
        shell: powershell
        run: |
          & .\build\poc_13.exe | Tee-Object -FilePath build\benchmark.txt
          if ($LASTEXITCODE -ne 0) {
            throw "POC-13 failed with exit code $LASTEXITCODE."
          }

      - name: Upload pipeline benchmark
        uses: actions/upload-artifact@v4
        with:
          name: poc13-native-dib-windows
          path: poc/poc_13_native_dib_present/build/benchmark.txt
          retention-days: 7

  # ==============================================================
  # POC-14/15: Direct3D device initialization (Windows)
  # ==============================================================
  poc-direct3d-devices:
    name: 'POC-14/15: Direct3D devices'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Analyze and test D3D11
        run: |
          dart analyze poc/poc_14_direct3d
          dart test poc/poc_14_direct3d

      - name: Analyze and test D3D12
        run: |
          dart analyze poc/poc_15_direct3d12
          dart test poc/poc_15_direct3d12

      - name: Compile and run AOT probes
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build\direct3d | Out-Null
          dart compile exe poc/poc_14_direct3d/bin/main.dart -o build/direct3d/poc_14.exe
          & .\build\direct3d\poc_14.exe
          if ($LASTEXITCODE -ne 0) {
            throw "POC-14 AOT probe failed with exit code $LASTEXITCODE."
          }
          dart compile exe poc/poc_15_direct3d12/bin/main.dart -o build/direct3d/poc_15.exe
          & .\build\direct3d\poc_15.exe
          if ($LASTEXITCODE -ne 0) {
            throw "POC-15 AOT probe failed with exit code $LASTEXITCODE."
          }

  # ==============================================================
  # POC-16/17/18: WebGL/WebGPU (Chrome headless)
  # ==============================================================
  poc-web-chrome:
    name: 'POC Web: WebGL1, WebGL2, WebGPU (Chrome)'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Verify Chrome
        run: google-chrome --version

      - name: Install dependencies
        run: dart pub get

      - name: Test WebGL 1 in Chrome
        working-directory: poc/poc_16_webgl1
        run: dart test -p chrome

      - name: Test WebGL 2 in Chrome
        working-directory: poc/poc_17_webgl2
        run: dart test -p chrome

      - name: Test WebGPU in Chrome
        working-directory: poc/poc_18_webgpu
        run: dart test -p chrome

      - name: Test MVP Web headless counter in Chrome
        working-directory: mvp/mvp_04_web_counter
        run: dart test -p chrome
