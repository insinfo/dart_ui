# CI principal multiplataforma para dart_ui
# Framework de Interface Gráfica Multiplataforma em 100% Puro Dart
name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'bin/**'
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'poc/**'
      - 'mvp/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'bin/**'
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'poc/**'
      - 'mvp/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: '3.6.2'

jobs:
  # ==============================================================
  # Análise estática (uma vez, bloqueante para testes)
  # ==============================================================
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-pub-analyze-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: dart-pub-analyze-

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

  # A inspeção de ambiente dos runners vive em sanity.yml (semanal/manual):
  # ela não exercita o código do projeto e o runner macOS custa 10x minutos.

  # ==============================================================
  # Testes multiplataforma
  # ==============================================================
  test:
    name: Test (${{ matrix.platform }})
    needs: analyze
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-pub-${{ matrix.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: dart-pub-${{ matrix.os }}-

      - name: Install dependencies
        run: dart pub get

      # ---- Linux: Instalar dependências de display ----
      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libwayland-client0 \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers \
            weston x11-utils x11-xserver-utils

      # ---- Testes portáveis (todas as plataformas) ----
      - name: Run portable CPU raster tests
        run: |
          dart test poc/poc_04_cpu_raster
          dart test mvp/mvp_01_win32_counter

      # ---- Linux: Testes de plataforma com Xvfb ----
      - name: Run platform tests (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p build
          Xvfb :99 -screen 0 1920x1080x24 -ac >build/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              cat build/xvfb.log
              exit 1
            fi
            sleep 1
          done
          xdpyinfo -display :99 | sed -n '1,3p'
          dart test poc/poc_02_x11_window
          dart compile exe tool/x11_backend_smoke.dart -o build/x11_backend_smoke
          timeout --kill-after=5 20 build/x11_backend_smoke
          mkdir -p mvp/mvp_02_x11_counter/build
          dart compile exe mvp/mvp_02_x11_counter/bin/main.dart -o mvp/mvp_02_x11_counter/build/mvp_02
          chmod +x mvp/mvp_02_x11_counter/build/mvp_02
          timeout 15 mvp/mvp_02_x11_counter/build/mvp_02 --smoke-test
        env:
          DISPLAY: ':99'
          LIBGL_ALWAYS_SOFTWARE: '1'
      # ---- Windows: Testes de plataforma ----
      - name: Run platform tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          dart test poc/poc_01_win32_window
          dart test poc/poc_05_com_direct2d
          dart test poc/poc_10_event_loop
          New-Item -ItemType Directory -Force -Path mvp/mvp_01_win32_counter/build | Out-Null
          dart compile exe mvp/mvp_01_win32_counter/bin/main.dart -o mvp/mvp_01_win32_counter/build/mvp_01.exe
          mvp/mvp_01_win32_counter/build/mvp_01.exe --smoke-test

  # ==============================================================
  # Wayland contra um compositor de verdade (Weston headless)
  # ==============================================================
  #
  # Ate 26/08/2026 nenhuma linha do backend Wayland tinha falado com um
  # compositor. As 14 suites de `test/backends/wayland/` rodam contra um
  # compositor FALSO em memoria: isso e teste unitario, nao integracao, e
  # deixa tres camadas sem cobertura alguma - a FFI de libc
  # (sendmsg/recvmsg/SCM_RIGHTS), o memfd/mmap do `wl_shm`, e a conformidade
  # do protocolo, porque um falso aceita exatamente o que foi escrito para
  # aceitar e um compositor mata a conexao num pedido malformado.
  #
  # Este job e a integracao: sobe Weston no backend headless e roda o smoke
  # compilado contra ele, do mesmo jeito que o passo de X11 sobe Xvfb.
  #
  # Deliberadamente sem `needs:`. A evidencia que ele produz nao deve depender
  # do estado de outra frente: se o `analyze` quebrar por um arquivo que nao e
  # deste backend, ainda queremos saber se o Wayland conversou com o
  # compositor.
  wayland:
    name: Wayland smoke (Weston headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Install Weston
        run: |
          sudo apt-get update
          sudo apt-get install -y weston libwayland-client0 xkb-data
          weston --version || true

      - name: Run the Wayland backend smoke under Weston headless
        run: |
          set -uo pipefail
          mkdir -p build
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY=wayland-ci
          export XDG_SESSION_TYPE=wayland
          socket="$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          common="--socket=$WAYLAND_DISPLAY --width=1024 --height=768"
          common="$common --idle-time=0 --no-config"

          # Weston renomeou os backends e o seletor de renderer entre as
          # versoes que as distribuicoes carregam. Em vez de fixar uma forma
          # e descobrir na proxima atualizacao do runner que ela sumiu, tenta
          # as conhecidas em ordem e imprime qual pegou.
          weston_pid=''
          start_weston() {
            rm -f "$socket" "$socket.lock"
            weston "$@" >>build/weston.log 2>&1 &
            weston_pid=$!
            for _ in $(seq 1 40); do
              if [ -S "$socket" ]; then
                echo "WESTON_ARGS=$*"
                return 0
              fi
              if ! kill -0 "$weston_pid" 2>/dev/null; then
                return 1
              fi
              sleep 0.5
            done
            kill "$weston_pid" 2>/dev/null || true
            return 1
          }

          started=0
          for backend in "--backend=headless --renderer=pixman" "--backend=headless --use-pixman" "--backend=headless-backend.so --use-pixman" "--backend=headless"; do
            echo "--- trying: weston $backend $common"
            # shellcheck disable=SC2086
            if start_weston $backend $common; then
              started=1
              break
            fi
            echo "--- that form failed; weston said:"
            tail -n 40 build/weston.log || true
          done
          if [ "$started" -ne 1 ]; then
            echo "Weston headless never opened $socket on this runner."
            cat build/weston.log || true
            exit 1
          fi
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT

          dart compile exe tool/wayland_backend_smoke.dart -o build/wayland_smoke
          # `|| status=...` e obrigatorio: o shell padrao do runner e
          # `bash -e`, e sem isso um smoke que falha aborta o passo antes de
          # imprimir o log do Weston - que e justamente o que explicaria a
          # falha.
          status=0
          timeout --kill-after=5 90 build/wayland_smoke || status=$?
          echo "--- weston log:"
          cat build/weston.log || true
          exit "$status"

      - name: Upload Weston log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weston-log
          path: build/weston.log
          retention-days: 7
          if-no-files-found: warn


  build-aot:
    name: AOT (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            ext: ''
            entrypoint: mvp/mvp_02_x11_counter/bin/main.dart
          - os: windows-latest
            platform: windows
            ext: '.exe'
            entrypoint: mvp/mvp_01_win32_counter/bin/main.dart
          - os: macos-14
            platform: macos-arm64
            ext: ''
            entrypoint: mvp/mvp_03_appkit_counter/bin/main.dart
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Cache Dart packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-pub-${{ matrix.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: dart-pub-${{ matrix.os }}-

      - name: Install dependencies
        run: dart pub get

      - name: AOT compile platform Counter
        shell: bash
        run: |
          test -f "${{ matrix.entrypoint }}"
          mkdir -p build
          dart compile exe "${{ matrix.entrypoint }}" \
            -o build/counter_${{ matrix.platform }}${{ matrix.ext }}
          echo "✅ AOT compilation successful"
          ls -la build/

      - name: Upload AOT binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.platform }}
          path: build/counter_*
          retention-days: 7
          if-no-files-found: error
