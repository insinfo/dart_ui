# Gate do framework de producao (package `dart_ui`, em lib/).
#
# Separado de ci.yml de proposito. Aquele workflow exercita POCs e MVPs que
# dependem de display, drivers e APIs privadas, e por isso vive em disparo
# manual. O codigo de lib/ e Dart puro: roda em qualquer lugar, sempre, e nao
# tem desculpa para quebrar. Por isso este roda em push e PR.
name: Framework

on:
  push:
    paths:
      - 'lib/**'
      - 'benchmark/**'
      - 'tool/check_budgets.dart'
      - 'bin/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/framework.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'benchmark/**'
      - 'tool/check_budgets.dart'
      - 'bin/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/framework.yml'
  workflow_dispatch:

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tem de acompanhar o SDK de desenvolvimento, e nao apenas satisfazer o
  # `^3.6.0` do pubspec. As duas versoes sao legitimas para o pacote, mas a
  # divergencia e silenciosa ate quebrar - e quando quebra, quebra no gate
  # de formatacao abaixo, antes de qualquer teste, com um sintoma que nao
  # se parece com a causa e que o desenvolvedor nao consegue ver
  # localmente. Aconteceu em 26/08/2026: um literal com separadores de
  # digito e parseado pelo `dart format` do 3.6.2 e recusado pelo do
  # 3.6.0, e as tres pernas caiam com erro de parse.
  #
  # Alinhar fecha a classe ate a proxima atualizacao local. A garantia de
  # verdade seria CI e ambiente lerem a versao de um lugar so.
  DART_SDK_VERSION: '3.6.2'

jobs:
  framework:
    name: 'Framework (${{ matrix.platform }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      # Formatting is a gate, not a suggestion: a diff that is half reformatted
      # hides the change that matters during review.
      - name: Check formatting
        run: dart format --line-length 80 --output=none --set-exit-if-changed bin lib test

      - name: Analyze
        run: dart analyze bin lib test

      # OBJC_DEBUG_MISSING_POOLS makes the Objective-C runtime print when an
      # object is autoreleased with no enclosing pool. It matters here and
      # nowhere else: a pool is per *thread*, and the macOS backend of ADR 0005
      # renders from a worker process, so the isolate that draws is never the
      # thread AppKit drains. Every Metal object that does not come from
      # alloc/new/copy/mutableCopy/Create is autoreleased into a pool that has
      # to be pushed by our own code, and a leak from forgetting one is
      # invisible until it is large. The variable is free on the other two legs
      # - nothing reads it - so it is set unconditionally rather than guarded,
      # which keeps the three legs running the identical command.
      - name: Test
        env:
          OBJC_DEBUG_MISSING_POOLS: 'YES'
        run: dart test test --reporter=expanded

      # The framework must stay AOT-compilable on every platform from day one.
      # Finding out at release time that something in the core needs mirrors or
      # deferred loading is the expensive way to learn it.
      - name: AOT smoke
        shell: bash
        run: |
          mkdir -p build
          cat > build/aot_smoke.dart <<'DART'
          import 'package:dart_ui/dart_ui.dart';
          import 'package:dart_ui/src/backends/default_platform_resolver.dart';

          // Alcancar o seletor e o ponto deste programa, nao um detalhe.
          //
          // A versao anterior instanciava um DisposableBag e um
          // BackendProbeResult, o que nao alcanca backend de GPU nenhum -
          // entao ela passava verde em 26/08/2026 enquanto
          // `dart compile exe` de qualquer aplicacao real falhava com
          // `Unexpected object (Class with illegal cid, full-aot)` num Struct
          // do Vulkan. O compilador AOT so ve o problema quando o codigo que
          // o contem entra no grafo, e e o seletor que o coloca la.
          void main() {
            final paths = PlatformBackendResolver.defaultPresentations();
            final bag = DisposableBag()..add('x', () {});
            bag.dispose();
            print('AOT_SMOKE=${bag.isDisposed && paths.isNotEmpty}');
            print('AOT_PRESENTATIONS=${paths.map((p) => p.name).join(',')}');
          }
          DART
          dart compile exe build/aot_smoke.dart -o build/aot_smoke
          ./build/aot_smoke | grep -q '^AOT_SMOKE=true$'

      # Section 36.3's budgets, enforced rather than printed.
      #
      # The suite proves the framework computes the right answer; almost
      # nothing proved what it costs. With five GPU backends in the tree and no
      # rendering budget, a regression in submit or present could reach a
      # release with nobody able to name the commit.
      #
      # Runs on all three legs on purpose. The ceilings in benchmark/budgets.dart
      # are loose enough to survive a shared runner - they catch a regression in
      # *kind* (an accidental quadratic, a cache that stopped hitting), not a
      # ten-percent drift - and the three platforms disagree about absolute
      # numbers in ways that are themselves worth seeing in the log.
      - name: Performance budgets
        run: dart run tool/check_budgets.dart
