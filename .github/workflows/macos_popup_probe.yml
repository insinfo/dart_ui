name: macOS native popup probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/src/backends/macos/**'
      - 'tool/macos_popup_probe.dart'
      - 'tool/macos_backend_smoke.dart'
      - 'tool/popup_window_smoke.dart'
      - 'tool/macos_clipboard_smoke.dart'
      - 'tool/macos_input_smoke.dart'
      - '.github/workflows/macos_popup_probe.yml'

concurrency:
  group: macos-popup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  popup:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.6.2'
      - run: dart pub get
      - name: Build the production AppKit host
        run: bash lib/src/backends/macos/native/build_host.sh
      - name: Inspect real NSPanel popup and tooltip windows
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: dart run tool/macos_popup_probe.dart
      - name: Enumerate NSScreen through the production backend
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: dart run tool/macos_backend_smoke.dart

      # The probe above proves the NSPanel exists; this proves an Application
      # puts it in the right place. Until 12/10/2026 the smoke was Windows-only,
      # and the first macOS run found the AppKit host answering positions with
      # the window *frame* instead of the content rect - every popup anchored
      # in a titled window landed one title bar too high - and never reporting
      # a move made while the window was hidden.
      # The popup smoke with no spare popup host, for the comparison only this
      # runner can make: since the spare existed the first menu here went from
      # 58 ms to 180-310 ms, which no faster machine reproduces. Run *before*
      # the step with the spare: the first run of a job pays the cold caches,
      # and in the other order that cost landed on the spare's line (209 ms
      # against 112 ms in run 38231006076), which is the confound this order
      # removes.
      - name: Popup window smoke without the spare host (comparison)
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
          DART_UI_MACOS_SPARE_HOST: '0'
        run: dart run tool/popup_window_smoke.dart

      - name: Popup window smoke through Application
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: dart run tool/popup_window_smoke.dart


      # The clipboard goes through the same AppKit host as the window, so it
      # is proven on the same runner. pbpaste and pbcopy are the witnesses: a
      # write is checked by reading it from another process, and a read by
      # writing from one.
      - name: Clipboard round trip through the pasteboard
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: dart run tool/macos_clipboard_smoke.dart

      # Input, from the AppKit event queue to a Button and a TextField. The
      # events are posted by the host into its own queue, so they cross the
      # same dequeue, monitor, protocol line and translation a click does;
      # posting from outside would need accessibility permission.
      - name: Input from the event queue to the widgets
        env:
          DART_UI_MACOS_HOST: ${{ github.workspace }}/lib/src/backends/macos/native/build/dart_ui_macos_host
        run: dart run tool/macos_input_smoke.dart
