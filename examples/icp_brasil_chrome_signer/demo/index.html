<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dart UI Assinador ICP-Brasil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript>Este aplicativo requer JavaScript.</noscript>
  <script>
    globalThis.__dartUiErrors = [];
    for (const level of ['error', 'warn', 'log']) {
      const original = console[level].bind(console);
      console[level] = (...values) => {
        __dartUiErrors.push(values.map(String).join(' '));
        original(...values);
      };
    }
    addEventListener('error', event => __dartUiErrors.push(String(event.error || event.message)));
    addEventListener('unhandledrejection', event => __dartUiErrors.push(String(event.reason)));
  </script>
  <script defer src="main.dart.js"></script>
</body>
</html>
